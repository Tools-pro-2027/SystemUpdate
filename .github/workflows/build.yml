name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - run: |
          mkdir -p build/classes
          mkdir -p build/apk

      - run: |
          find app/src/main/java -name "*.java" > sources.txt
          javac -source 8 -target 8 -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar -d build/classes @sources.txt

      - run: |
          d8 --output build/ --lib $ANDROID_HOME/platforms/android-34/android.jar $(find build/classes -name "*.class")

      - run: |
          cp app/src/main/AndroidManifest.xml build/
          cd build
          aapt package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F app-unsigned.apk .
          zip -uj app-unsigned.apk classes.dex

      - run: |
          cd build
          keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Android" -noprompt
          zipalign -v 4 app-unsigned.apk app-aligned.apk
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out app-release.apk app-aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app-release.apk
